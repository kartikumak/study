<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f6f2">
<title>Same or Study</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f7f6f2;--card:#fff;--ink:#17171a;--mut:#7c7c87;--line:rgba(20,20,30,.08);--soft:#f1f0ec;--acc:#17171a;--accink:#fff;--p0:#5e6ad2;--p1:#d9904f;--p2:#3f9e87;--ok:#2f947c;--bad:#d4604f;--s0:#5e6ad2;--s1:#d9904f;--s2:#3f9e87;--s3:#b8678f;--s4:#6a9bc3;--s5:#b9b9c0;--sh:0 1px 2px rgba(20,20,30,.04),0 12px 30px -16px rgba(20,20,30,.15);--ring:0 0 0 3px rgba(94,106,210,.16)}
[data-theme=dark]{--bg:#0c0c0f;--card:#151519;--ink:#f3f3f6;--mut:#8d8d99;--line:rgba(255,255,255,.08);--soft:#1e1e24;--acc:#f3f3f6;--accink:#0c0c0f;--sh:0 1px 2px rgba(0,0,0,.45),0 14px 32px -16px rgba(0,0,0,.75);--ring:0 0 0 3px rgba(138,149,242,.2)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.48 Inter,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;transition:background .25s,color .25s}
#app{max-width:560px;margin:0 auto;padding:0 16px 116px;min-height:100vh}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3{margin:0;letter-spacing:-.025em}
h1{font-size:30px;line-height:1.12;font-weight:700}h2{font-size:19px;font-weight:600}h3{font-size:12px;color:var(--mut);font-weight:600;letter-spacing:.03em;text-transform:uppercase}

/* Header & Live Strip */
.top{display:flex;justify-content:space-between;align-items:center;padding:calc(env(safe-area-inset-top) + 16px) 2px 12px}
.brand{font-size:11px;letter-spacing:.22em;font-weight:700;color:var(--mut)}
.rn{color:var(--ink);font-size:15px;font-weight:600;display:flex;align-items:center;gap:7px;margin-top:2px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--mut);display:inline-block;opacity:.45;flex:none;transition:background .2s,transform .2s}.dot.on{background:var(--ok);opacity:1;box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 18%,transparent)}
.hb{display:flex;gap:8px}
.ib{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;transition:transform .14s,background .15s,border-color .15s}
.ib:hover{border-color:color-mix(in srgb,var(--ink) 22%,transparent)}.ib:active{transform:scale(.95)}
.ic{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.roombar{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}.roombar::-webkit-scrollbar{display:none}
.rchip{flex:1;min-width:110px;display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:14px;background:var(--card);border:1px solid var(--line);font-size:12px;box-shadow:0 1px 2px rgba(0,0,0,.02)}
.rchip.empty{border-style:dashed;opacity:.65;justify-content:center;color:var(--mut)}
.rchip .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rchip .st{font-size:11px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Cards & Animations */
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;margin-bottom:12px;box-shadow:var(--sh);transition:border-color .2s,box-shadow .2s}
.anim .card,.anim .rcard{animation:up .36s cubic-bezier(.2,.85,.25,1) both}
.anim .card:nth-child(2){animation-delay:.03s}.anim .card:nth-child(3){animation-delay:.06s}.anim .card:nth-child(4){animation-delay:.09s}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes popIn{0%{opacity:0;transform:scale(.94) translateY(6px)}100%{opacity:1;transform:none}}
@keyframes pulseRing{0%,100%{opacity:.55}50%{opacity:1}}

/* Buttons */
.btn{height:50px;border-radius:15px;background:var(--acc);color:var(--accink);font-weight:600;border:0;width:100%;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .14s,opacity .18s,box-shadow .18s;box-shadow:0 2px 8px -2px rgba(0,0,0,.18)}
.btn:hover:not(:disabled){opacity:.93}.btn:active:not(:disabled){transform:scale(.982)}.btn:disabled{opacity:.38;cursor:not-allowed;box-shadow:none}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);box-shadow:none}
.btn.ghost:hover:not(:disabled){background:var(--soft)}
.btn.ok{background:var(--ok);color:#fff}
.btn.sm{height:38px;border-radius:11px;font-size:13px;width:auto;padding:0 14px;box-shadow:none}
.btn.xs{height:30px;border-radius:9px;font-size:12px;width:auto;padding:0 10px;box-shadow:none}
.btn+.btn{margin-top:8px}
.btnrow{display:flex;gap:8px}.btnrow .btn{margin-top:0}

/* Layout helpers */
.row{display:flex;align-items:center;gap:11px}.sp{flex:1;min-width:0}
.big{font-size:38px;font-weight:700;letter-spacing:-.04em;line-height:1}
.mut{color:var(--mut)}.sm{font-size:13px}.xs{font-size:12px}
.c0{--c:var(--p0)}.c1{--c:var(--p1)}.c2{--c:var(--p2)}.c3{--c:var(--s3)}.c4{--c:var(--s4)}.c5{--c:#8d73d6}
.avwrap{position:relative;display:inline-flex;flex:none}
.av{width:38px;height:38px;border-radius:12px;background:var(--c);color:#fff;display:grid;place-items:center;font-weight:600;flex:none;letter-spacing:-.02em}
.avdot{position:absolute;right:-2px;bottom:-2px;width:10px;height:10px;border-radius:50%;background:var(--mut);border:2px solid var(--card)}.avdot.on{background:var(--ok)}
.pr{padding:11px 0;border-top:1px solid var(--line);animation:popIn .28s ease both}.pr:first-of-type{border:0;padding-top:4px}.pr:last-of-type{padding-bottom:2px}
.pill{font-size:11.5px;padding:3px 9px;border-radius:99px;background:var(--soft);color:var(--mut);font-weight:600;white-space:nowrap;display:inline-flex;align-items:center;gap:5px}
.pill.ok{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)}
.pill.st{background:color-mix(in srgb,var(--p1) 16%,transparent);color:var(--p1)}
.pill.live{background:color-mix(in srgb,var(--p0) 14%,transparent);color:var(--p0)}
.pill.warn{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad)}
.dots{display:flex;gap:5px;margin-top:14px}.dots i{flex:1;height:5px;border-radius:4px;background:var(--soft);transition:background .35s}.dots i.on{background:var(--ink)}
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.trio .card{margin:0;padding:14px}.trio .v{font-size:21px;font-weight:700;letter-spacing:-.03em;margin-top:4px}

/* Diary & Tags */
.tagrow{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.tchip{border:1px solid var(--line);background:var(--bg);border-radius:99px;padding:5px 11px;font-size:12.5px;font-weight:500;color:var(--mut);transition:.14s}
.tchip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.dtag{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--soft);color:var(--ink);margin-right:4px;margin-top:6px}
.dtag.productive,.dtag.deepfocus,.dtag.energized{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.dtag.sleepy,.dtag.distracted,.dtag.stressed{background:color-mix(in srgb,var(--bad) 15%,transparent);color:var(--bad)}
.dtag.notsoproductive{background:color-mix(in srgb,var(--p1) 18%,transparent);color:var(--p1)}
.preset-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;margin-top:6px}
.preset{padding:9px 11px;border-radius:12px;border:1px solid var(--line);background:var(--bg);text-align:left;font-size:12.5px;font-weight:500;transition:.14s}
.preset:hover{border-color:var(--ink);background:var(--soft)}

/* Options & Game */
.opts{display:grid;gap:8px}
.opt{display:flex;align-items:center;gap:12px;text-align:left;padding:14px 15px;border-radius:15px;background:var(--card);border:1px solid var(--line);font-weight:500;transition:transform .14s,border-color .16s,box-shadow .16s,opacity .2s}
.opt:hover:not(:disabled){border-color:color-mix(in srgb,var(--ink) 28%,transparent)}
.opt:active:not(:disabled){transform:scale(.988)}
.opt .n{width:26px;height:26px;border-radius:8px;background:var(--soft);display:grid;place-items:center;font-size:12px;font-weight:600;color:var(--mut);flex:none;transition:.16s}
.opt.sel{border-color:var(--ink);box-shadow:0 0 0 1.5px var(--ink);background:color-mix(in srgb,var(--ink) 3%,var(--card))}.opt.sel .n{background:var(--ink);color:var(--bg)}
.opt:disabled:not(.sel){opacity:.45;cursor:default}
.dock{position:sticky;bottom:88px;padding-top:12px;z-index:3}
.rcard{display:flex;align-items:center;gap:12px;padding:13px 14px;border-radius:15px;background:var(--soft);margin-bottom:8px;animation:popIn .34s cubic-bezier(.2,.9,.25,1) both;animation-delay:calc(var(--i)*110ms)}
.rcard b{margin-left:auto;font-weight:700;font-size:15px}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:5px 11px;border-radius:99px}
.tag.ok{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)}.tag.bad{background:color-mix(in srgb,var(--bad) 15%,transparent);color:var(--bad)}
.clock{font-size:58px;font-weight:700;letter-spacing:-.05em;text-align:center;line-height:1;margin:8px 0 14px}.clock.done{color:var(--ok)}
.prog{height:6px;background:var(--soft);border-radius:4px;overflow:hidden}.prog i{display:block;height:100%;background:var(--ink);border-radius:4px;transition:width .9s linear}

/* Suggestions */
.sug-form{display:flex;gap:8px;margin-top:10px}
.sug-form input{height:42px;padding:0 13px;font-size:14px;border-radius:12px}
.sug-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);animation:popIn .25s ease both}
.sug-item:first-of-type{border-top:0;padding-top:4px}
.sug-acts{display:flex;gap:6px;flex:none}
.iconbtn{width:30px;height:30px;border-radius:9px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;transition:.14s;flex:none}
.iconbtn.yes{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 35%,transparent)}.iconbtn.yes:hover{background:color-mix(in srgb,var(--ok) 12%,transparent)}
.iconbtn.no{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 35%,transparent)}.iconbtn.no:hover{background:color-mix(in srgb,var(--bad) 12%,transparent)}

/* Charts & Stats */
.chart{width:100%;height:auto;display:block}.grid{stroke:var(--line);stroke-width:1}.ax{fill:var(--mut);font-size:9.5px}
.bar{fill:var(--c)}.anim .bar{transform-box:fill-box;transform-origin:bottom;animation:grow .6s cubic-bezier(.2,.8,.2,1) both}
@keyframes grow{from{transform:scaleY(0)}}
.seg{transition:stroke-dasharray .5s}
.leg{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:12px;color:var(--mut)}.leg i{display:inline-block;width:8px;height:8px;border-radius:3px;background:var(--c);margin-right:5px}
.chips{display:flex;gap:6px;margin:10px 0 4px;overflow-x:auto;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:transparent;border-radius:99px;padding:6px 12px;font-size:13px;white-space:nowrap;transition:.15s}.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.hbar{height:8px;background:var(--soft);border-radius:5px;overflow:hidden;margin-top:6px}.hbar i{display:block;height:100%;background:var(--c);border-radius:5px;transition:width .6s}
.empty{padding:22px 0;text-align:center;color:var(--mut);font-size:13px}
.rep{padding:14px 0;border-top:1px solid var(--line)}.rep:first-of-type{border:0}
.day{font-size:11.5px;color:var(--mut);margin:16px 4px 8px;font-weight:600;letter-spacing:.04em;text-transform:uppercase}

/* Navigation & Sheets */
nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;padding:8px 16px calc(env(safe-area-inset-bottom) + 10px);background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);z-index:5}
nav div{display:flex;width:100%;max-width:528px;gap:2px}
nav button{flex:1;border:0;background:none;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:500;padding:6px 0;border-radius:12px;transition:color .15s,background .15s}
nav button.on{color:var(--ink);font-weight:600}
.banner{background:color-mix(in srgb,var(--p1) 14%,var(--card));border:1px solid color-mix(in srgb,var(--p1) 30%,transparent);border-radius:13px;padding:9px 14px;font-size:13px;color:var(--ink);margin-bottom:12px;text-align:center;animation:pulseRing 2s infinite}
#sheet{position:fixed;inset:0;z-index:20;pointer-events:none}#sheet.open{pointer-events:auto}
.back{position:absolute;inset:0;background:rgba(0,0,0,.42);opacity:0;transition:.22s}.open .back{opacity:1}
.sh{position:absolute;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;background:var(--card);border-radius:26px 26px 0 0;padding:10px 20px calc(env(safe-area-inset-bottom) + 22px);max-height:92vh;overflow:auto;transform:translateY(100%);transition:transform .28s cubic-bezier(.2,.85,.25,1)}.open .sh{transform:none}
.grab{width:40px;height:4px;border-radius:3px;background:var(--line);margin:0 auto 14px}
label{display:block;font-size:13px;color:var(--mut);margin:14px 0 6px;font-weight:500}
input,textarea{width:100%;padding:12px 14px;border-radius:13px;border:1px solid var(--line);background:var(--bg);outline:0;font-size:16px;transition:border-color .15s,box-shadow .15s}
input:focus,textarea:focus{border-color:var(--ink);box-shadow:var(--ring)}textarea{min-height:76px;resize:vertical}
.og{display:grid;grid-template-columns:1fr 1fr;gap:8px}.og input{padding:10px 12px}
.sw{display:flex;align-items:center;justify-content:space-between;margin-top:16px;gap:12px}
.sw input{width:46px;height:28px;appearance:none;background:var(--soft);border-radius:20px;position:relative;padding:0;border:1px solid var(--line);flex:none}
.sw input:checked{background:var(--ok)}.sw input::after{content:"";position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}.sw input:checked::after{left:20px}
.center{min-height:82vh;display:flex;flex-direction:column;justify-content:center}
.lnk{font-size:12px;background:var(--soft);padding:10px 12px;border-radius:12px;word-break:break-all;color:var(--mut);user-select:all}
#toast{position:fixed;left:50%;bottom:96px;transform:translate(-50%,16px);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:99px;font-size:13px;font-weight:500;opacity:0;transition:.24s;z-index:30;pointer-events:none;max-width:90vw;box-shadow:0 8px 24px rgba(0,0,0,.22)}#toast.show{opacity:1;transform:translate(-50%,0)}
.think::after{content:"";animation:dt 1.2s infinite}@keyframes dt{0%{content:"."}33%{content:".."}66%{content:"..."}}
</style>
</head>
<body>
<div id="app"></div><div id="sheet"></div><div id="toast"></div>
<script src="config.js"></script>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {getDatabase,ref,onValue,set,update,push,remove,runTransaction,onDisconnect,serverTimestamp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js";

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const arr=x=>x?Object.values(x):[];
const pad=n=>String(n).padStart(2,'0');
const fmt=m=>{m=Math.round(m||0);const h=Math.floor(m/60),r=m%60;return h?`${h}h${r?` ${r}m`:''}`:`${r}m`};
const dkey=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const pkey=k=>{const parts=(k||'').split('-');const [y,m,d]=(parts.length===3?parts:[2026,1,1]).map(Number);return new Date(y,m-1,d)};
const mondayOf=d=>{const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-(x.getDay()+6)%7);return x};
const rid=n=>Array.from(crypto.getRandomValues(new Uint8Array(n)),b=>'abcdefghijkmnpqrstuvwxyz23456789'[b%32]).join('');
const ago=t=>{if(!t)return '';const m=Math.floor((Date.now()-t)/60000);return m<1?'just now':m<60?`${m}m ago`:m<1440?`${Math.floor(m/60)}h ago`:`${Math.floor(m/1440)}d ago`};
const ic=p=>`<svg class="ic" viewBox="0 0 24 24">${p}</svg>`;
const toast=m=>{const t=$('#toast');if(!t)return;t.textContent=m;t.className='show';clearTimeout(toast.t);toast.t=setTimeout(()=>t.className='',2600)};
const setTheme=t=>{document.documentElement.dataset.theme=t;localStorage.setItem('sos:theme',t);const m=$('meta[name=theme-color]');if(m)m.content=t==='dark'?'#0c0c0f':'#f7f6f2'};
try{setTheme(localStorage.getItem('sos:theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'));}catch{setTheme('light')}

/* ---------- firebase & state ---------- */
const cfg=window.SOS_CONFIG||{};
let db=null;
if(cfg.databaseURL&&!/PASTE/i.test(cfg.databaseURL)){try{db=getDatabase(initializeApp({databaseURL:cfg.databaseURL}))}catch(e){console.error(e)}}

const DEF=["Pizza","Biryani","Burger","Pasta","Sushi","Momos","Sandwich","Noodles","Tacos","Dosa"];
const PRESETS={
  food:{label:"Food & Treats",items:["Pizza","Biryani","Burger","Pasta","Sushi","Momos","Sandwich","Noodles","Tacos","Dosa"]},
  study:{label:"Study Sprints",items:["Physics","Maths","Chemistry","Coding","Revision","Mock Test","Notes","Reading","PYQs","Flashcards"]},
  movies:{label:"Movie / Chill",items:["Sci-Fi","Thriller","Comedy","Anime","Action","Horror","Documentary","Mystery","Drama","Rewatch"]},
  hangout:{label:"Hangout Spots",items:["Cafe","Street Food","Bowling","Gaming","Park Walk","Mall","Drive","Board Games","Chai Spot","Home"]}
};
const DIARY_TAGS=["@productive","@deepfocus","@sleepy","@notsoproductive","@distracted","@energized","@stressed"];

const S={
  roomId:'',me:null,loaded:false,err:null,room:null,players:{},presence:{},config:{},
  game:{status:'lobby',round:0},answers:{},sessions:{},reports:{},suggestions:{},
  connected:false,offset:0,tab:'home',pick:null,pickRound:0,subj:'all',hist:'all',histN:20,
  prevPlayers:null,prevOnline:null,busy:{},diaryTags:['@productive'],diaryFilter:'all'
};
const base=()=>`rooms/${S.roomId}`;
const now=()=>Date.now()+S.offset;
const plist=()=>Object.entries(S.players||{}).map(([id,p])=>({id,...p})).sort((a,b)=>(a.joinedAt||0)-(b.joinedAt||0));
const pidx=id=>Math.max(0,plist().findIndex(p=>p.id===id));
const pname=id=>S.players?.[id]?.name||'Player';
const isHost=()=>S.room?.hostId===S.me?.pid;
const opts=()=>{
  const raw=S.config?.options;
  if(!raw)return [...DEF];
  const list=Array.isArray(raw)?raw:Object.keys(raw).sort((a,b)=>+a-+b).map(k=>raw[k]);
  return list.length?list:[...DEF];
};
const opt=i=>opts()[i]||'—';
const mins=()=>S.config?.studyMinutes||60;
const link=()=>location.origin+location.pathname+'#'+S.roomId;
const online=id=>S.presence?.[id]?.online===true;
const av=(id,sz,showDot=false)=>`<span class="avwrap"><span class="av c${pidx(id)%6}" ${sz?`style="width:${sz}px;height:${sz}px;font-size:${Math.round(sz/2.5)}px;border-radius:${Math.round(sz/3)}px"`:''}>${esc(pname(id)[0]||'?').toUpperCase()}</span>${showDot?`<i class="avdot ${online(id)?'on':''}"></i>`:''}</span>`;
const saveId=()=>localStorage.setItem('sos:id:'+S.roomId,JSON.stringify(S.me));
const savedName=()=>localStorage.getItem('sos:name')||'';

const diaryKey=()=>`sos:diary:${S.roomId}:${S.me?.pid||'local'}`;
const getDiary=()=>{try{return JSON.parse(localStorage.getItem(diaryKey())||'[]')}catch{return []}};
const saveDiary=list=>{try{localStorage.setItem(diaryKey(),JSON.stringify(list))}catch{toast('Device storage full')}};
const fmtStamp=ts=>{const d=new Date(ts);return d.toLocaleDateString('en',{day:'numeric',month:'short'})+' · '+d.toLocaleTimeString('en',{hour:'2-digit',minute:'2-digit'})};

function askConfirm(title,msg,okText='Confirm',danger=false){
  return new Promise(resolve=>{
    sheet(`<h2>${esc(title)}</h2><p class="mut" style="margin:8px 0 18px">${esc(msg)}</p>
    <div class="btnrow">
      <button type="button" class="btn ghost" id="mCancel">Cancel</button>
      <button type="button" class="btn ${danger?'':'ok'}" style="${danger?'background:var(--bad);color:#fff':''}" id="mOk">${esc(okText)}</button>
    </div>`);
    const c=$('#mCancel'),o=$('#mOk');
    if(c)c.onclick=()=>{closeSheet();resolve(false)};
    if(o)o.onclick=()=>{closeSheet();resolve(true)};
  });
}

let unsub=null,hbTimer=null;
function enter(id){
  S.roomId=id;S.loaded=false;S.err=null;S.room=null;S.presOn=false;S.lastStatus=null;S.me=null;
  S.prevPlayers=null;S.prevOnline=null;
  if(unsub)try{unsub()}catch{};unsub=null;
  if(!id||!db){render();return}
  localStorage.setItem('sos:last',id);
  try{S.me=JSON.parse(localStorage.getItem('sos:id:'+id)||'null')}catch{}
  unsub=onValue(ref(db,'rooms/'+id),snap=>{
    const v=snap.val()||{};
    S.loaded=true;S.err=null;
    S.room=v.meta||null;
    S.players=v.players||{};
    S.presence=v.presence||{};
    S.config=v.config||{};
    S.game=v.game||{status:'lobby',round:0};
    S.answers=v.answers||{};
    S.sessions=v.sessions||{};
    S.reports=v.reports||{};
    S.suggestions=v.suggestions||{};
    notifyChanges();
    after();
    render();
  },err=>{
    S.loaded=true;
    S.err=err?.message||'Connection error. Check your internet or Firebase rules.';
    render();
  });
}

function notifyChanges(){
  if(!S.room||!S.me||!S.players[S.me.pid])return;
  const curIds=Object.keys(S.players||{});
  if(S.prevPlayers){
    curIds.forEach(id=>{
      if(!S.prevPlayers.includes(id)&&id!==S.me.pid)toast(`${pname(id)} joined the room`);
    });
  }
  S.prevPlayers=curIds;
  const curOn={};
  curIds.forEach(id=>{
    const isOn=online(id);
    curOn[id]=isOn;
    if(S.prevOnline&&id!==S.me.pid&&S.prevOnline[id]!==undefined&&S.prevOnline[id]!==isOn){
      toast(`${pname(id)} is ${isOn?'back online':'offline'}`);
    }
  });
  S.prevOnline=curOn;
}

if(db){
  onValue(ref(db,'.info/serverTimeOffset'),s=>S.offset=s.val()||0);
  onValue(ref(db,'.info/connected'),s=>{
    S.connected=!!s.val();
    S.presOn=false;
    after();
    render();
  });
  document.addEventListener('visibilitychange',()=>{
    if(document.hidden){pres(false);S.presOn=false}
    else{S.presOn=false;after();render()}
  });
  addEventListener('beforeunload',()=>pres(false));
  addEventListener('hashchange',()=>enter(location.hash.slice(1)));
}

function pres(on,activity){
  if(!db||!S.me||!S.room||!S.players[S.me.pid])return;
  const r=ref(db,`${base()}/presence/${S.me.pid}`);
  const act=activity||currentActivity();
  if(on){
    onDisconnect(r).set({online:false,lastSeen:serverTimestamp(),activity:'offline'})
      .then(()=>set(r,{online:true,lastSeen:serverTimestamp(),activity:act})).catch(()=>{});
  }else{
    set(r,{online:false,lastSeen:serverTimestamp(),activity:'offline'}).catch(()=>{});
  }
}
function currentActivity(){
  const g=S.game,me=S.me?.pid;
  if(!me)return 'idle';
  if(g.status==='choosing'){
    const a=S.answers['r'+g.round]||{};
    return a[me]!==undefined?'locked':'selecting';
  }
  if(g.status==='study'){
    const st=S.sessions['r'+g.round]?.[me]?.status;
    return st==='completed'?'done':st==='studying'?'studying':'ready';
  }
  return 'lobby';
}
clearInterval(hbTimer);
hbTimer=setInterval(()=>{
  if(S.connected&&!document.hidden&&S.me&&S.room&&S.players[S.me.pid]){
    set(ref(db,`${base()}/presence/${S.me.pid}`),{online:true,lastSeen:serverTimestamp(),activity:currentActivity()}).catch(()=>{});
  }
},25000);

function after(){
  if(!S.room||!S.me||!S.players[S.me.pid])return;
  if(!S.presOn&&S.connected&&!document.hidden){S.presOn=true;pres(true)}
  const g=S.game,key=g.status+g.round;
  if(S.lastStatus&&S.lastStatus!==key&&S.tab==='home'&&['choosing','survived','study','finished'].includes(g.status)){
    S.tab='game';
  }
  S.lastStatus=key;

  if(g.status!=='choosing'){S.resolving=null;return}
  const a=S.answers['r'+g.round]||{},ids=Object.keys(S.players||{});
  if(ids.length>=2&&ids.every(i=>a[i]!==undefined)&&S.resolving!==g.round){
    S.resolving=g.round;
    const picks=ids.map(i=>a[i]),same=new Set(picks).size===1,t=now(),r=g.round;
    runTransaction(ref(db,base()+'/game'),c=>{
      if(!c||c.status!=='choosing'||c.round!==r)return;
      return {
        status:same?'survived':'study',
        round:r,
        active:c.active||null,
        matched:same?picks[0]:null,
        studyStartedAt:same?null:t,
        studyEndsAt:same?null:t+mins()*60000
      };
    }).catch(()=>{})
    .finally(()=>{setTimeout(()=>{if(S.resolving===r)S.resolving=null},1500)});
  }
}

function nextRound(){
  const r=S.game.round;
  if(S.busy.next)return;
  S.busy.next=true;
  runTransaction(ref(db,base()+'/game'),c=>{
    if(!c||c.round!==r||!['survived','study'].includes(c.status))return;
    let a=arr(c.active).map(Number);
    if(c.status==='survived'&&S.config.removeMatched!==false)a=a.filter(i=>i!==c.matched);
    const allValid=opts().map((o,i)=>o.trim()?i:-1).filter(i=>i>=0);
    allValid.forEach(idx=>{
      if(idx>=(c.maxIdxSeen||0)&&!a.includes(idx))a.push(idx);
    });
    if(a.length<2)return {status:'finished',round:r,active:a.length?a:null,matched:c.matched??null};
    return {status:'choosing',round:r+1,active:a,matched:null,maxIdxSeen:Math.max(c.maxIdxSeen||0,...allValid)+1};
  }).catch(()=>toast('Could not advance round. Try again')).finally(()=>{S.busy.next=false});
}

/* ---------- stats & charts ---------- */
function stats(){
  const pl=plist(),rs=arr(S.reports),today=new Date(),tk=dkey(today),mon=mondayOf(today),wk=dkey(mon);
  const per=pl.map(()=>({total:0,today:0,week:0,n:0}));
  const days=[...Array(7)].map((_,i)=>{const d=new Date(today);d.setDate(d.getDate()-6+i);return d});
  const weeks=[...Array(8)].map((_,i)=>{const d=new Date(mon);d.setDate(d.getDate()-7*(7-i));return d});
  const di={},wi={};days.forEach((d,i)=>di[dkey(d)]=i);weeks.forEach((d,i)=>wi[dkey(d)]=i);
  const daily=pl.map(()=>Array(7).fill(0)),weekly=pl.map(()=>Array(8).fill(0)),subj={},dset=new Set();
  let group=0,gweek=0;
  rs.forEach(r=>{
    const k=pl.findIndex(p=>p.id===r.pid);if(k<0||!per[k])return;const m=+r.minutes||0;
    per[k].total+=m;per[k].n++;group+=m;if(r.date)dset.add(r.date);
    if(r.date===tk)per[k].today+=m;
    if(r.date){
      const w=dkey(mondayOf(pkey(r.date)));
      if(w===wk){per[k].week+=m;gweek+=m}
      if(r.date in di)daily[k][di[r.date]]+=m;
      if(w in wi)weekly[k][wi[w]]+=m;
    }
    const sk=(r.subject||'Other').trim().toLowerCase();
    if(!subj[sk])subj[sk]={label:r.subject||'Other',by:pl.map(()=>0)};
    subj[sk].by[k]=(subj[sk].by[k]||0)+m;
  });
  let streak=0;const d=new Date(today);if(!dset.has(dkey(d)))d.setDate(d.getDate()-1);
  while(dset.has(dkey(d))){streak++;d.setDate(d.getDate()-1)}
  const dl=days.map(d=>d.toLocaleDateString('en',{weekday:'short'}));
  const wl=weeks.map(d=>`${d.getDate()}/${d.getMonth()+1}`);
  return {per,group,gweek,streak,daily,weekly,dl,wl,subj};
}

function growthLineSvg(labels,series){
  const W=320,H=175,L=28,R=10,B=20,T=10,n=labels.length;
  const cum=series.map(a=>{let acc=0;return a.map(v=>(acc+=v))});
  const mx=Math.max(0,...cum.flat());
  if(!mx)return `<div class="empty">Complete study sessions to see real-time growth curves.</div>`;
  const hm=Math.ceil(mx/60),step=Math.max(1,Math.ceil(hm/3)),top=Math.ceil(hm/step)*step*60;
  const x=i=>L+(W-L-R)*(n>1?i/(n-1):0.5);
  const y=m=>T+(H-T-B)*(1-m/top);
  const colors=['var(--p0)','var(--p1)','var(--p2)','var(--s3)','var(--s4)','#8d73d6'];
  let s=`<svg viewBox="0 0 ${W} ${H}" class="chart">`;
  for(let h=0;h<=top/60;h+=step){
    const yy=y(h*60);
    s+=`<line x1="${L}" x2="${W-R}" y1="${yy}" y2="${yy}" class="grid"/><text x="${L-6}" y="${yy+3}" class="ax" text-anchor="end">${h}h</text>`;
  }
  labels.forEach((lb,i)=>{
    s+=`<text x="${x(i)}" y="${H-5}" class="ax" text-anchor="middle">${lb}</text>`;
  });
  cum.forEach((pts,k)=>{
    const col=colors[k%colors.length];
    const d=pts.map((v,i)=>`${i===0?'M':'L'}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
    s+=`<path d="${d}" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="stroke:${col}"/>`;
    pts.forEach((v,i)=>{
      s+=`<circle cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="3.2" style="fill:${col}"><title>${esc(pname(plist()[k]?.id))}: ${fmt(v)}</title></circle>`;
    });
  });
  return s+'</svg>';
}

function barsSvg(labels,series){
  const W=320,H=170,L=26,B=20,T=8,n=labels.length,cw=(W-L)/n,bw=Math.min(26,cw*.58);
  const mx=Math.max(...labels.map((_,i)=>series.reduce((s,x)=>s+x[i],0)));
  if(!mx)return `<div class="empty">Nothing logged in this period yet.</div>`;
  const hm=Math.ceil(mx/60),step=Math.ceil(hm/3),top=Math.ceil(hm/step)*step*60,y=m=>T+(H-T-B)*(1-m/top);
  let s=`<svg viewBox="0 0 ${W} ${H}" class="chart">`;
  for(let h=0;h<=top/60;h+=step){const yy=y(h*60);s+=`<line x1="${L}" x2="${W}" y1="${yy}" y2="${yy}" class="grid"/><text x="${L-6}" y="${yy+3}" class="ax" text-anchor="end">${h}h</text>`}
  labels.forEach((lb,i)=>{
    const x=L+cw*i+(cw-bw)/2;let acc=0;
    series.forEach((v,k)=>{if(!v[i])return;const y0=y(acc),y1=y(acc+v[i]);s+=`<rect class="bar c${k%6}" x="${x}" y="${y1}" width="${bw}" height="${y0-y1}" rx="2.5" style="animation-delay:${i*35}ms"><title>${esc(pname(plist()[k]?.id))}: ${fmt(v[i])}</title></rect>`;acc+=v[i]});
    s+=`<text x="${x+bw/2}" y="${H-5}" class="ax" text-anchor="middle">${lb}</text>`;
  });
  return s+'</svg>';
}

function donut(items){
  const tot=items.reduce((s,x)=>s+x.val,0);
  if(!tot)return `<div class="empty">No subjects yet.</div>`;
  const r=42,C=2*Math.PI*r;let off=0;
  const segs=items.map((x,i)=>{const l=x.val/tot*C,e=`<circle class="seg" r="${r}" cx="60" cy="60" fill="none" stroke-width="14" style="stroke:var(--s${i%6})" stroke-dasharray="${Math.max(l-2,.1)} ${C}" stroke-dashoffset="${-off}" transform="rotate(-90 60 60)"/>`;off+=l;return e}).join('');
  return `<div class="row"><svg viewBox="0 0 120 120" style="width:128px;flex:none">${segs}<text x="60" y="58" text-anchor="middle" style="font-size:15px;font-weight:700;fill:var(--ink)">${fmt(tot)}</text><text x="60" y="73" text-anchor="middle" class="ax">total</text></svg>
  <div class="sp">${items.map((x,i)=>`<div class="row sm" style="padding:4px 0"><i style="width:9px;height:9px;border-radius:3px;background:var(--s${i%6});flex:none"></i><span class="sp" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(x.label)}</span><b>${Math.round(x.val/tot*100)}%</b></div>`).join('')}</div></div>`;
}

/* ---------- views ---------- */
function render(){
  const app=$('#app');if(!app)return;
  const active=document.activeElement;
  if(app.contains(active)&&/INPUT|TEXTAREA/.test(active.tagName))return;
  const k=S.roomId+S.tab+S.game.status+S.game.round+S.loaded+(S.me?1:0);
  app.className=k!==S.lastK?'anim':'';S.lastK=k;
  app.innerHTML=route();
  tick();
}

function liveStatusText(p){
  if(!online(p.id))return 'Offline';
  const g=S.game;
  if(g.status==='choosing'){
    const a=S.answers['r'+g.round]||{};
    return a[p.id]!==undefined?'Locked in':'Selecting…';
  }
  if(g.status==='study'){
    const st=S.sessions['r'+g.round]?.[p.id]?.status;
    return st==='completed'?'Report done':st==='studying'?'Studying':'Waiting';
  }
  return 'Online';
}

function route(){
  if(!db)return `<div class="center"><h1>Almost there</h1><p class="mut">Open <b>config.js</b> and paste your Firebase Database URL between the quotes, then save.</p></div>`;
  if(!S.roomId){
    const last=localStorage.getItem('sos:last');
    if(last&&!S.skipLast){S.skipLast=1;location.hash=last;return ''}
    return `<div class="center">
      <div class="brand" style="margin-bottom:12px">SAME OR STUDY</div>
      <h1>Pick the same.<br>Or study.</h1>
      <p class="mut" style="margin:12px 0 22px">A private real-time room for 2 or more friends. Create a room and share the link on WhatsApp.</p>
      <form data-form="create">
        <label>Room name</label><input name="room" maxlength="30" required placeholder="e.g. Study Squad">
        <label>Your name</label><input name="me" maxlength="20" required value="${esc(savedName())}" placeholder="Your first name">
        <button class="btn" style="margin-top:20px">Create private room</button>
      </form>
    </div>`;
  }
  if(!S.loaded)return `<div class="center" style="text-align:center"><div class="mut">Connecting to room…</div></div>`;
  if(S.err)return `<div class="center"><h2>Connection issue</h2><p class="mut">${esc(S.err)}</p><button class="btn" data-act="retry">Try again</button><button class="btn ghost" data-act="home">Back</button></div>`;
  if(!S.room)return `<div class="center"><h2>Room not found</h2><p class="mut">Double-check your invite link, or create a new room for your group.</p><button class="btn" data-act="home">Create a room</button></div>`;

  if(!S.me||!S.players[S.me.pid]){
    const pl=plist();
    return `<div class="center">
      <div class="brand" style="margin-bottom:10px">SAME OR STUDY</div>
      <h1>${esc(S.room.name)}</h1>
      <p class="mut" style="margin:8px 0 18px">${pl.length} player${pl.length===1?'':'s'} currently in this room.</p>
      <form data-form="join"><label>Your name</label><input name="me" maxlength="20" required value="${esc(savedName())}" placeholder="Enter your name to join"><button class="btn" style="margin-top:16px">Join room</button></form>
      ${pl.length?`<h3 style="margin:26px 0 10px">Reconnecting on a new tab or device?</h3>
      ${pl.map(p=>`<button class="opt" style="width:100%;margin-bottom:8px" data-act="claim" data-pid="${p.id}">${av(p.id,30,true)}<span class="sp">Continue as <b>${esc(p.name)}</b></span><span class="pill ${online(p.id)?'ok':''}">${online(p.id)?'Online':'Join'}</span></button>`).join('')}`:''}
    </div>`;
  }

  const pl=plist();
  const T={home:homeV,game:gameV,diary:diaryV,stats:statsV,hist:histV}[S.tab]||homeV;
  const nav=[
    ['home','Room','<path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>'],
    ['game','Game','<rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/>'],
    ['diary','Diary','<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>'],
    ['stats','Growth','<polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/>'],
    ['hist','Reports','<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>']
  ];
  const slots=Math.max(2,pl.length);
  const strip=Array.from({length:slots},(_,i)=>{
    const p=pl[i];
    if(!p)return `<div class="rchip empty"><span>Waiting #${i+1}</span></div>`;
    return `<div class="rchip">${av(p.id,24,true)}<div style="min-width:0"><div class="nm">${esc(p.name)}</div><div class="st">${esc(liveStatusText(p))}</div></div></div>`;
  }).join('');

  return `<header class="top">
    <div><div class="brand">SAME OR STUDY</div><div class="rn">${esc(S.room.name)} <i class="dot ${S.connected?'on':''}" title="${S.connected?'Live synced':'Reconnecting'}"></i></div></div>
    <div class="hb">
      <button class="ib" data-act="share" aria-label="Invite friends" title="Invite">${ic('<path d="M4 12v7a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/>')}</button>

  ${T()}
  <nav><div>${nav.map(([k,l,p])=>`<button class="${S.tab===k?'on':''}" data-act="tab" data-t="${k}">${ic(p)}${l}</button>`).join('')}</div></nav>`;

  return `<div class="card">
    <div class="row"><h3>Word suggestions</h3><div class="sp"></div><span class="xs mut">${sugs.length} pending</span></div>
    <form class="sug-form" data-form="suggest">
      <input name="word" maxlength="28" required autocomplete="off" placeholder="Suggest a new word or option…">

  </div>`;

function homeV(){
  const st=stats(),g=S.game,pl=plist(),host=isHost();
  const active=g.status==='lobby'?opts().map((o,i)=>o.trim()?i:-1).filter(i=>i>=0):arr(g.active);
  const rl=g.status==='lobby'?'Ready to start':g.status==='finished'?'Finished':`Round ${g.round}`;
  let cta;
  if(pl.length<2)cta=`<button class="btn" disabled>Waiting for at least 1 more friend (${pl.length}/2 min)</button>`;
  else if(g.status==='lobby')cta=host?`<button class="btn" data-act="start">Start game (${pl.length} players)</button>`:`<button class="btn" disabled>Waiting for ${esc(pname(S.room.hostId))} to start</button>`;
  else if(g.status==='finished')cta=host?`<button class="btn" data-act="reset">Play again</button>`:`<button class="btn ghost" data-act="tab" data-t="game">View final result</button>`;
  else cta=`<button class="btn ok" data-act="tab" data-t="game">CONTINUE TO ROUND ${g.round}</button>`;

  const total=Math.max(10,opts().length);
  return `<div class="card">
    <h3>Current session</h3>
    <div class="row" style="margin-top:8px"><div class="big">${rl}</div><div class="sp"></div><div style="text-align:right"><div style="font-weight:700;font-size:20px">${active.length}</div><div class="mut xs">options left</div></div></div>
    <div class="dots">${Array.from({length:total},(_,i)=>`<i class="${active.includes(i)?'on':''}"></i>`).join('')}</div>
    <div style="margin-top:16px">${cta}</div>
  </div>

function gameV(){
  const g=S.game,pl=plist(),host=isHost(),me=S.me.pid,a=S.answers['r'+g.round]||{};

  if(g.status==='lobby'){
    return `<div class="card">
      <h3>How it works</h3>
      <h2 style="margin-top:6px">Same answer, or study together</h2>
      <p class="mut" style="margin:8px 0 16px">Everyone secretly picks one option. If all ${pl.length||2} players pick the exact same word, you survive and that option retires. If anyone differs, everyone completes a ${mins()}-minute study challenge.</p>
      ${pl.length>=2&&host?`<button class="btn" data-act="start">Start Round 1 (${pl.length} players)</button>`:`<button class="btn" disabled>${pl.length<2?`Waiting for friends (${pl.length}/2 min)`:`Waiting for ${esc(pname(S.room.hostId))} to start`}</button>`}
    </div>
    ${suggestionsCard()}`;
  }

  if(g.status==='finished'){
    return `<div class="card">
      <span class="tag ok">Game complete</span>
      <h2 style="margin-top:12px">All options played out</h2>
      <p class="mut" style="margin:8px 0 16px">Great run! All your study logs and insights remain saved in this room.</p>
      ${host?`<button class="btn" data-act="reset">Start a new game</button>`:`<button class="btn ghost" data-act="tab" data-t="stats">View group insights</button>`}
    </div>`;
  }

  if(g.status==='choosing'){
    if(S.pickRound!==g.round){S.pick=null;S.pickRound=g.round}
    const mine=a[me],locked=mine!==undefined,sel=locked?mine:S.pick;
    const lockedCount=pl.filter(p=>a[p.id]!==undefined).length;
    const activeList=arr(g.active);

    return `<div class="card">
      <div class="row"><h3>Round ${g.round} · ${activeList.length} options left</h3><div class="sp"></div><span class="pill live">${lockedCount}/${pl.length} locked</span></div>
      <h2 style="margin-top:6px">${locked?'Locked in · waiting for friends':'Choose your secret answer'}</h2>
      <p class="xs mut" style="margin:4px 0 0">Selections stay completely hidden until all ${pl.length} players submit.</p>
    </div>

    <div class="card" style="padding:12px 16px">
      ${pl.map(p=>{
        const isDone=a[p.id]!==undefined;
        return `<div class="row pr" style="padding:7px 0">
          ${av(p.id,28,true)}
          <span class="sp" style="font-weight:500">${esc(p.name)}${p.id===me?' <span class="mut xs">(you)</span>':''}</span>
          ${isDone?'<span class="pill ok">✓ Locked in</span>':`<span class="pill think">${online(p.id)?'Selecting':'Offline'}</span>`}
        </div>`;
      }).join('')}
    </div>

    <div class="opts">${activeList.map((i,n)=>`<button class="opt ${sel===i?'sel':''}" data-act="pick" data-i="${i}" ${locked?'disabled':''}><span class="n">${n+1}</span><span class="sp">${esc(opt(i))}</span>${sel===i?'<span class="xs mut">'+(locked?'Your pick':'Selected')+'</span>':''}</button>`).join('')}</div>

    ${locked?'':`<div class="dock"><button class="btn" data-act="lock" ${S.pick==null?'disabled':''}>Lock in answer</button></div>`}
    ${suggestionsCard()}`;
  }

  /* Reveal state: survived or study */
  const same=g.status==='survived';
  const activeList=arr(g.active);
  const remCount=same&&S.config.removeMatched!==false?Math.max(0,activeList.length-1):activeList.length;

  let h=`<div class="card">
    <div class="row"><h3>Round ${g.round} · Simultaneous reveal</h3><div class="sp"></div><span class="tag ${same?'ok':'bad'}">${same?`All ${pl.length} matched!`:'No match'}</span></div>
    <div style="margin:14px 0 4px">${pl.map((p,k)=>`<div class="rcard" style="--i:${k}">${av(p.id,32,true)}<span style="font-weight:500">${esc(p.name)}</span><b>${esc(opt(a[p.id]))}</b></div>`).join('')}</div>
  </div>`;

  if(same){
    const rm=S.config.removeMatched!==false;
    h+=`<div class="card">
      <h2>Everyone survived</h2>
      <p class="mut" style="margin:6px 0 16px">${rm?`“${esc(opt(g.matched))}” is retired. ${remCount} option${remCount===1?'':'s'} remaining.`:`${remCount} options remaining.`}</p>
      <button class="btn ok" data-act="next">${remCount<2?'FINISH GAME':'CONTINUE'}</button>
    </div>`;
  }else{
    const ss=pl.map(p=>statusOf(p.id)),all=ss.length>=2&&ss.every(s=>s==='completed'),my=statusOf(me);
    const L={none:['Not started',''],studying:['Studying','st'],completed:['Report saved','ok']};
    h+=`<div class="card"><h3 id="cl">${mins()}-minute study challenge</h3><div class="clock" id="clock">--:--</div><div class="prog"><i id="cbar" style="width:0"></i></div></div>
    <div class="card">
      <h3>Group study progress</h3>
      ${pl.map((p,i)=>`<div class="row pr">${av(p.id,32,true)}<span class="sp" style="font-weight:500">${esc(p.name)}</span><span class="pill ${L[ss[i]][1]}">${L[ss[i]][0]}</span></div>`).join('')}
      <div style="margin-top:16px">
        ${my==='none'?`<button class="btn" data-act="begin">Start my timer</button>`:my==='studying'?`<button class="btn" data-act="report" data-r="${g.round}">Finish &amp; submit study report</button>`:`<button class="btn ghost" disabled>✓ Your report is saved</button>`}
        ${all?`<button class="btn ok" style="margin-top:10px" data-act="next">CONTINUE TO ROUND ${g.round+1}</button>`:host?`<button class="btn ghost" style="margin-top:8px" data-act="skip">Skip challenge (host)</button>`:''}
      </div>
    </div>`;
  }
  return h;
}

function tick(){
  const el=$('#clock');if(!el||S.game.status!=='study'||!S.game.studyEndsAt)return;
  const ms=S.game.studyEndsAt-now(),tot=(S.game.studyEndsAt-S.game.studyStartedAt)||1;
  if(ms<=0){el.textContent='00:00';el.classList.add('done');const cl=$('#cl');if(cl)cl.textContent="Time's up · submit your report"}
  else{const s=Math.ceil(ms/1000);el.textContent=`${pad(Math.floor(s/60))}:${pad(s%60)}`}
  const cb=$('#cbar');if(cb)cb.style.width=Math.min(100,Math.max(0,100-ms/tot*100))+'%';
}
setInterval(tick,1000);

/* ---------- actions & forms ---------- */
const ACT={
  tab:t=>{S.tab=t.dataset.t;render();window.scrollTo(0,0)},
  home:()=>{location.hash='';S.skipLast=1;localStorage.removeItem('sos:last');enter('')},
  retry:()=>enter(S.roomId),
  theme:()=>setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark'),
  settings:settingsSheet,
  close:closeSheet,
  copy:async()=>{try{await navigator.clipboard.writeText(link());toast('Room link copied')}catch{prompt('Copy this link',link())}},
  wa:()=>{const txt=encodeURIComponent(`Join our Same or Study room "${S.room?.name||'Squad'}": ${link()}`);window.open(`https://wa.me/?text=${txt}`,'_blank','noopener')},
  share:async()=>{
    if(navigator.share){try{await navigator.share({title:S.room?.name||'Same or Study',text:'Join our Same or Study room:',url:link()});return}catch{}}
    ACT.copy();
  },
  subj:t=>{S.subj=t.dataset.p;render()},
  hist:t=>{S.hist=t.dataset.p;render()},
  more:()=>{S.histN+=20;render()},
  claim:t=>{
    const p=S.players[t.dataset.pid];if(!p)return;
    S.me={pid:t.dataset.pid,name:p.name};
    localStorage.setItem('sos:name',p.name);
    saveId();S.presOn=false;after();render();
  },
  pick:t=>{S.pick=+t.dataset.i;S.pickRound=S.game.round;render()},
  lock:()=>{
    const i=S.pick,r=S.game.round;
    if(i==null||S.busy.lock)return;
    S.busy.lock=true;
    runTransaction(ref(db,`${base()}/answers/r${r}/${S.me.pid}`),v=>v==null?i:undefined)
      .then(()=>{pres(true,'locked')})
      .catch(()=>toast('Could not lock in. Check connection'))
      .finally(()=>{S.busy.lock=false});
  },
  start:()=>{
    if(S.busy.start)return;
    if(plist().length<2)return toast('Need at least 2 players to start');
    const valid=opts().map((o,i)=>o.trim()?i:-1).filter(i=>i>=0);
    if(valid.length<2)return toast('Add at least 2 options in settings');
    S.busy.start=true;
    runTransaction(ref(db,base()+'/game'),c=>{
      if(c&&c.status!=='lobby'&&c.status!=='finished')return;
      return {status:'choosing',round:1,active:valid,matched:null,maxIdxSeen:opts().length};
    }).then(res=>{
      if(res.committed)update(ref(db,base()),{answers:null,sessions:null});
    }).catch(()=>toast('Could not start game')).finally(()=>{S.busy.start=false});
  },
  next:()=>nextRound(),
  skip:async()=>{if(await askConfirm('Skip study challenge?','This will advance everyone to the next round immediately.','Skip challenge'))nextRound()},
  preset:t=>{
    const p=PRESETS[t.dataset.k];if(!p)return;
    const inputs=document.querySelectorAll('#optGrid input');
    inputs.forEach((inp,i)=>{inp.value=p.items[i]||''});
    toast(`Loaded “${p.label}” — tap Save settings`);
  },
  kick:async t=>{
    if(!isHost())return;
    const pid=t.dataset.pid;
    if(!pid||pid===S.me.pid||!S.players[pid])return;
    const name=pname(pid);
    if(!(await askConfirm(`Remove ${name}?`,`${name} will be removed from the active room so the remaining players can continue.`,'Remove user',true)))return;
    const ups={[`players/${pid}`]:null,[`presence/${pid}`]:null};
    if(S.game.status==='choosing')ups[`answers/r${S.game.round}/${pid}`]=null;
    if(S.game.status==='study')ups[`sessions/r${S.game.round}/${pid}`]=null;
    update(ref(db,base()),ups)
      .then(()=>{toast(`Removed ${name}`);if($('#sheet').classList.contains('open'))settingsSheet()})
      .catch(()=>toast('Could not remove user'));
  },
  toggleTag:t=>{
    const tag=t.dataset.tag;
    const idx=S.diaryTags.indexOf(tag);
    if(idx>=0)S.diaryTags.splice(idx,1);else S.diaryTags.push(tag);
    t.classList.toggle('on');
  },
  dfilter:t=>{S.diaryFilter=t.dataset.tag;render()},
  delDiary:async t=>{
    const id=t.dataset.id;
    if(!(await askConfirm('Delete diary entry?','This private entry will be permanently deleted from this device.','Delete',true)))return;
    saveDiary(getDiary().filter(e=>e.id!==id));
    toast('Diary entry deleted');
    render();
  },
  begin:()=>{
    set(ref(db,`${base()}/sessions/r${S.game.round}/${S.me.pid}`),{status:'studying',startedAt:now()})
      .then(()=>pres(true,'studying'))
      .catch(()=>toast('Could not start timer'));
  },
  report:t=>reportSheet(+t.dataset.r),
  log:()=>reportSheet(0),
  acceptSug:t=>{
    if(!isHost())return;
    const id=t.dataset.id,sug=S.suggestions[id];if(!sug)return;
    const current=opts();
    const exists=current.some(w=>w.trim().toLowerCase()===sug.word.trim().toLowerCase());
    const nextOpts=[...current];
    let newIdx=-1;
    if(!exists){
      const emptySlot=nextOpts.findIndex(w=>!w.trim());
      if(emptySlot>=0){nextOpts[emptySlot]=sug.word.trim();newIdx=emptySlot}
      else{nextOpts.push(sug.word.trim());newIdx=nextOpts.length-1}
    }
    const updates={[`suggestions/${id}`]:null,[`config/options`]:nextOpts};
    if(newIdx>=0&&S.game.status!=='lobby'&&S.game.status!=='finished'){
      const act=arr(S.game.active);
      if(!act.includes(newIdx))updates['game/active']=[...act,newIdx];
    }
    update(ref(db,base()),updates)
      .then(()=>toast(`Added “${sug.word}” to options`))
      .catch(()=>toast('Could not approve suggestion'));
  },
  rejectSug:t=>{
    if(!isHost())return;
    remove(ref(db,`${base()}/suggestions/${t.dataset.id}`)).catch(()=>toast('Could not remove suggestion'));
  },
  reset:async()=>{
    if(await askConfirm('Reset game to lobby?','All study reports, growth charts, and private diaries are kept.','Reset game')){
      update(ref(db,base()),{game:{status:'lobby',round:0},answers:null,sessions:null});
      closeSheet();S.tab='home';
    }
  },
  leave:async()=>{
    if(await askConfirm('Switch player on this device?','You can rejoin anytime by tapping your name.','Switch player')){
      pres(false);
      localStorage.removeItem('sos:id:'+S.roomId);
      S.me=null;
      closeSheet();
    }
  }
};

const FORMS={
  create:async f=>{
    if(S.busy.create)return;
    const d=Object.fromEntries(new FormData(f)),id=rid(14),pid=rid(8),t=Date.now();
    const rname=(d.room||'').trim(),mname=(d.me||'').trim();
    if(!rname||!mname)return;
    S.busy.create=true;
    try{
      await set(ref(db,'rooms/'+id),{
        meta:{name:rname,hostId:pid,createdAt:t},
        players:{[pid]:{name:mname,joinedAt:t}},
        config:{options:DEF,studyMinutes:60,removeMatched:true},
        game:{status:'lobby',round:0}
      });
      localStorage.setItem('sos:name',mname);
      localStorage.setItem('sos:id:'+id,JSON.stringify({pid,name:mname}));
      location.hash=id;
    }catch{toast('Could not create room. Check connection.')}
    finally{S.busy.create=false}
  },
  join:f=>{
    if(S.busy.join)return;
    const name=(new FormData(f).get('me')||'').trim(),pid=rid(8);
    if(!name)return;
    S.busy.join=true;
    runTransaction(ref(db,base()+'/players'),p=>{
      p=p||{};
      const existing=Object.entries(p).find(([,v])=>v.name.trim().toLowerCase()===name.toLowerCase());
      if(existing)return;
      p[pid]={name,joinedAt:Date.now()};
      return p;
    }).then(r=>{
      if(r.committed){
        S.me={pid,name};
        localStorage.setItem('sos:name',name);
        saveId();S.presOn=false;after();render();
      }else{
        const dup=plist().find(p=>p.name.trim().toLowerCase()===name.toLowerCase());
        toast(dup?`“${dup.name}” is already in the room — tap their card below to reconnect`:'Could not join room. Try again');
      }
    }).catch(()=>toast('Could not join. Try again')).finally(()=>{S.busy.join=false});
  },
  diary:f=>{
    const d=Object.fromEntries(new FormData(f));
    const text=(d.text||'').trim(),win=(d.window||'').trim();
    if(!text||!win)return;
    const list=getDiary();
    list.push({
      id:rid(8),
      window:win,
      mins:Math.max(1,Math.min(720,Math.round(+d.mins||mins()))),
      text,
      tags:[...S.diaryTags],
      ts:Date.now()
    });
    saveDiary(list);
    const ta=f.querySelector('textarea[name=text]');if(ta)ta.value='';
    toast('Saved privately on this device');
    render();
  },
  suggest:f=>{
    const inp=f.querySelector('input[name=word]');
    if(!inp)return;
    const word=(inp.value||'').trim();
    if(!word)return;
    const low=word.toLowerCase();
    const inOpts=opts().some(o=>o.trim().toLowerCase()===low);
    const inSugs=arr(S.suggestions).some(s=>s.word.trim().toLowerCase()===low);
    if(inOpts||inSugs)return toast('That word is already in the list!');
    inp.value='';
    const key=push(ref(db,base()+'/suggestions')).key;
    set(ref(db,`${base()}/suggestions/${key}`),{word,pid:S.me.pid,createdAt:now()})
      .then(()=>toast('Suggestion sent to room'))
      .catch(()=>toast('Could not send suggestion'));
  },
  report:f=>{
    if(S.busy.report)return;
    const d=Object.fromEntries(new FormData(f)),round=+f.dataset.round,key=push(ref(db,base()+'/reports')).key;
    const up={
      ['reports/'+key]:{
        pid:S.me.pid,round:round||null,subject:d.subject.trim(),topic:d.topic.trim(),
        minutes:Math.round(+d.minutes),accomplished:d.accomplished.trim(),
        notes:(d.notes||'').trim(),date:dkey(new Date()),createdAt:serverTimestamp()
      }
    };
    if(round){
      up[`sessions/r${round}/${S.me.pid}`]={
        status:'completed',
        startedAt:S.sessions['r'+round]?.[S.me.pid]?.startedAt||null,
        completedAt:now()
      };
    }
    S.busy.report=true;
    update(ref(db,base()),up)
      .then(()=>{pres(true,'done');toast('Study report saved');closeSheet()})
      .catch(()=>toast('Sync failed. Please try saving again'))
      .finally(()=>{S.busy.report=false});
  },
  settings:f=>{
    if(!isHost())return closeSheet();
    const d=Object.fromEntries(new FormData(f));
    const count=Math.max(10,opts().length);
    const options=Array.from({length:count},(_,i)=>(d['o'+i]||'').trim()).filter((v,i)=>i<10||v!=='');
    if(options.filter(Boolean).length<2)return toast('Keep at least 2 options');
    update(ref(db,base()),{
      'meta/name':d.room.trim()||S.room.name,
      config:{options,studyMinutes:Math.min(240,Math.max(5,+d.mins||60)),removeMatched:!!d.rm}
    }).then(()=>{toast('Settings saved');closeSheet()}).catch(()=>toast('Could not save settings'));
  }
};

document.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(t)ACT[t.dataset.act]?.(t)});
document.addEventListener('submit',e=>{e.preventDefault();FORMS[e.target.dataset.form]?.(e.target)});

enter(location.hash.slice(1));
if(!db)render();
</script>
</body>
